<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Love</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4A2535, #2E1020);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .container { text-align: center; padding: 40px; }
    .heart-emoji { font-size: 48px; animation: pulse 1s ease-in-out infinite; margin-bottom: 20px; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    .title { color:#FF96B4; font-size:24px; font-weight:300; margin-bottom:8px; }
    .subtitle { color:#BE91A5; font-size:14px; font-weight:200; margin-bottom:30px; }
    canvas { display:block; margin:0 auto; filter:drop-shadow(0 0 30px rgba(255,150,180,0.4)); }
    .footer { color:#BE91A5; font-size:14px; margin-top:30px; }
    .floating-hearts { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
    .float-heart { position:absolute; bottom:-50px; animation:floatUp linear infinite; opacity:0.6; }
    @keyframes floatUp { 0%{transform:translateY(0) rotate(0deg);opacity:0.6} 100%{transform:translateY(-100vh) rotate(360deg);opacity:0} }
  </style>
</head>
<body>
  <div class="floating-hearts" id="floating-hearts"></div>
  <div class="container">
    <div class="heart-emoji">💕</div>
    <h1 class="title">Scan Me!</h1>
    <p class="subtitle">Open with your phone camera</p>
    <canvas id="qr-canvas"></canvas>
    <p class="footer">🌸 Happy Birthday Faqih 🌸</p>
  </div>

  <script>
    const canvas = document.getElementById('qr-canvas');
    const ctx = canvas.getContext('2d');

    // Load QR code with HIGH error correction (H level = 30% recovery)
    // This allows parts to be covered and still scannable
    const qrImg = new Image();
    qrImg.crossOrigin = 'anonymous';
    qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https%3A%2F%2Fhbdfaqih.netlify.app%2F&format=png&bgcolor=FFFFFF&color=2E1020&qzone=4&ecc=H';

    qrImg.onload = function() {
      const W = 420;
      const H = 440;
      canvas.width = W;
      canvas.height = H;

      // Background
      ctx.fillStyle = '#4A2535';
      ctx.fillRect(0, 0, W, H);

      // Heart path function
      function heartPath(cx, cy, s) {
        ctx.beginPath();
        ctx.moveTo(cx, cy + s * 0.35);
        // Left bump
        ctx.bezierCurveTo(cx - s * 0.02, cy + s * 0.25, cx - s * 0.7, cy + s * 0.05, cx - s * 0.7, cy - s * 0.2);
        ctx.bezierCurveTo(cx - s * 0.7, cy - s * 0.55, cx - s * 0.3, cy - s * 0.6, cx, cy - s * 0.35);
        // Right bump
        ctx.bezierCurveTo(cx + s * 0.3, cy - s * 0.6, cx + s * 0.7, cy - s * 0.55, cx + s * 0.7, cy - s * 0.2);
        ctx.bezierCurveTo(cx + s * 0.7, cy + s * 0.05, cx + s * 0.02, cy + s * 0.25, cx, cy + s * 0.35);
        ctx.closePath();
      }

      const cx = W / 2;
      const cy = H / 2 + 10;
      const s = 340;

      // Clip and draw QR code inside heart
      ctx.save();
      heartPath(cx, cy, s);
      ctx.clip();

      // Draw QR code - slightly smaller to keep corners safe
      const qrDrawSize = 360;
      const ox = (W - qrDrawSize) / 2;
      const oy = (H - qrDrawSize) / 2 + 10;
      ctx.drawImage(qrImg, ox, oy, qrDrawSize, qrDrawSize);

      // Semi-transparent pink overlay on the bottom part (inside heart curve)
      // to make the heart shape more visible
      ctx.restore();

      // Draw heart outline with glow
      ctx.save();
      ctx.shadowColor = 'rgba(255, 150, 180, 0.8)';
      ctx.shadowBlur = 30;
      ctx.strokeStyle = '#FF96B4';
      ctx.lineWidth = 5;
      heartPath(cx, cy, s);
      ctx.stroke();
      ctx.restore();

      // Draw a subtle fill on the areas outside QR but inside heart
      // to make heart shape more visible
      ctx.save();
      heartPath(cx, cy, s);
      ctx.clip();
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = '#FF96B4';
      // Draw pink tint on the curved bottom area of heart
      ctx.fillRect(0, cy + s * 0.1, W, H - cy);
      ctx.restore();
    };

    // Floating hearts
    const container = document.getElementById('floating-hearts');
    const emojis = ['💕','❤️','💖','💗','🌸','🌺'];
    function spawnHeart() {
      const h = document.createElement('div');
      h.className = 'float-heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left = Math.random()*100+'%';
      h.style.fontSize = (Math.random()*20+10)+'px';
      h.style.animationDuration = (Math.random()*5+5)+'s';
      container.appendChild(h);
      setTimeout(()=>h.remove(),10000);
    }
    for(let i=0;i<15;i++) setTimeout(spawnHeart, i*300);
    setInterval(spawnHeart, 800);
  </script>
</body>
</html>
