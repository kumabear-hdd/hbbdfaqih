<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Love</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4A2535, #2E1020);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .container { text-align: center; padding: 40px; }
    .heart-emoji { font-size: 48px; animation: pulse 1s ease-in-out infinite; margin-bottom: 20px; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    .title { color:#FF96B4; font-size:24px; font-weight:300; margin-bottom:8px; }
    .subtitle { color:#BE91A5; font-size:14px; font-weight:200; margin-bottom:30px; }
    .qr-img {
      display: block;
      margin: 0 auto;
      max-width: 320px;
      width: 100%;
      border-radius: 20px;
      filter: drop-shadow(0 0 30px rgba(255, 150, 180, 0.4));
    }
    .footer { color:#BE91A5; font-size:14px; margin-top:30px; }
    .floating-hearts { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
    .float-heart { position:absolute; bottom:-50px; animation:floatUp linear infinite; opacity:0.6; }
    @keyframes floatUp { 0%{transform:translateY(0) rotate(0deg);opacity:0.6} 100%{transform:translateY(-100vh) rotate(360deg);opacity:0} }
  </style>
</head>
<body>
  <div class="floating-hearts" id="floating-hearts"></div>
  <div class="container">
    <div class="heart-emoji">💕</div>
    <h1 class="title">Scan Me!</h1>
    <p class="subtitle">Open with your phone camera</p>
    <img src="qr-code.png" alt="QR Code Love" class="qr-img">
    <p class="footer">🌸 Happy Birthday Faqih 🌸</p>
  </div>
  <script>
    const container = document.getElementById('floating-hearts');
    const emojis = ['💕','❤️','💖','💗','🌸','🌺'];
    function spawnHeart() {
      const h = document.createElement('div');
      h.className = 'float-heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left = Math.random()*100+'%';
      h.style.fontSize = (Math.random()*20+10)+'px';
      h.style.animationDuration = (Math.random()*5+5)+'s';
      container.appendChild(h);
      setTimeout(()=>h.remove(),10000);
    }
    for(let i=0;i<15;i++) setTimeout(spawnHeart, i*300);
    setInterval(spawnHeart, 800);
  </script>
</body>
</html>
