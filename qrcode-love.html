<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Love</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4A2535, #2E1020);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .container { text-align: center; padding: 40px; }
    .heart-emoji { font-size: 48px; animation: pulse 1s ease-in-out infinite; margin-bottom: 20px; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    .title { color:#FF96B4; font-size:24px; font-weight:300; margin-bottom:8px; }
    .subtitle { color:#BE91A5; font-size:14px; font-weight:200; margin-bottom:30px; }
    .qr-wrapper { display:inline-block; position:relative; filter:drop-shadow(0 0 30px rgba(255,150,180,0.4)); }
    canvas { display:block; margin:0 auto; }
    .footer { color:#BE91A5; font-size:14px; margin-top:30px; }
    .floating-hearts { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
    .float-heart { position:absolute; bottom:-50px; animation:floatUp linear infinite; opacity:0.6; }
    @keyframes floatUp { 0%{transform:translateY(0) rotate(0deg);opacity:0.6} 100%{transform:translateY(-100vh) rotate(360deg);opacity:0} }
    .loading { color:#FF96B4; font-size:16px; margin:40px 0; }
  </style>
</head>
<body>
  <div class="floating-hearts" id="floating-hearts"></div>
  <div class="container">
    <div class="heart-emoji">💕</div>
    <h1 class="title">Scan Me!</h1>
    <p class="subtitle">Open with your phone camera</p>
    <div class="qr-wrapper">
      <canvas id="qr-canvas" width="350" height="350"></canvas>
    </div>
    <p class="footer">🌸 Happy Birthday Faqih 🌸</p>
  </div>

  <script>
    const canvas = document.getElementById('qr-canvas');
    const ctx = canvas.getContext('2d');
    const heartSize = 350;

    // Load QR code from API
    const qrImg = new Image();
    qrImg.crossOrigin = 'anonymous';
    qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fhbdfaqih.netlify.app%2F&format=png&bgcolor=FFFFFF&color=2E1020&qzone=2';

    qrImg.onload = function() {
      // Clear canvas
      ctx.clearRect(0, 0, heartSize, heartSize);

      // Background
      ctx.fillStyle = '#4A2535';
      ctx.fillRect(0, 0, heartSize, heartSize);

      // Create heart clipping path
      ctx.save();
      ctx.beginPath();
      const cx = heartSize / 2;
      const cy = heartSize / 2;
      const s = heartSize * 0.45;

      // Heart shape
      const topCurveHeight = s * 0.3;
      ctx.moveTo(cx, cy + s * 0.7);
      ctx.bezierCurveTo(
        cx - s * 0.05, cy + s * 0.55,
        cx - s * 1.0, cy + s * 0.2,
        cx - s * 1.0, cy - topCurveHeight
      );
      ctx.bezierCurveTo(
        cx - s * 1.0, cy - s * 0.8,
        cx - s * 0.35, cy - s * 0.95,
        cx, cy - s * 0.5
      );
      ctx.bezierCurveTo(
        cx + s * 0.35, cy - s * 0.95,
        cx + s * 1.0, cy - s * 0.8,
        cx + s * 1.0, cy - topCurveHeight
      );
      ctx.bezierCurveTo(
        cx + s * 1.0, cy + s * 0.2,
        cx + s * 0.05, cy + s * 0.55,
        cx, cy + s * 0.7
      );
      ctx.closePath();
      ctx.clip();

      // Draw QR code inside heart
      const imgSize = heartSize * 0.85;
      const offsetX = (heartSize - imgSize) / 2;
      const offsetY = (heartSize - imgSize) / 2 + 10;
      ctx.drawImage(qrImg, offsetX, offsetY, imgSize, imgSize);

      ctx.restore();

      // Draw heart outline glow
      ctx.save();
      ctx.shadowColor = 'rgba(255, 150, 180, 0.6)';
      ctx.shadowBlur = 25;
      ctx.strokeStyle = '#FF96B4';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx, cy + s * 0.7);
      ctx.bezierCurveTo(
        cx - s * 0.05, cy + s * 0.55,
        cx - s * 1.0, cy + s * 0.2,
        cx - s * 1.0, cy - topCurveHeight
      );
      ctx.bezierCurveTo(
        cx - s * 1.0, cy - s * 0.8,
        cx - s * 0.35, cy - s * 0.95,
        cx, cy - s * 0.5
      );
      ctx.bezierCurveTo(
        cx + s * 0.35, cy - s * 0.95,
        cx + s * 1.0, cy - s * 0.8,
        cx + s * 1.0, cy - topCurveHeight
      );
      ctx.bezierCurveTo(
        cx + s * 1.0, cy + s * 0.2,
        cx + s * 0.05, cy + s * 0.55,
        cx, cy + s * 0.7
      );
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    };

    qrImg.onerror = function() {
      ctx.fillStyle = '#FF96B4';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Loading QR...', heartSize/2, heartSize/2);
    };

    // Floating hearts
    const container = document.getElementById('floating-hearts');
    const emojis = ['💕','❤️','💖','💗','🌸','🌺'];
    function spawnHeart() {
      const h = document.createElement('div');
      h.className = 'float-heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left = Math.random()*100+'%';
      h.style.fontSize = (Math.random()*20+10)+'px';
      h.style.animationDuration = (Math.random()*5+5)+'s';
      container.appendChild(h);
      setTimeout(()=>h.remove(),10000);
    }
    for(let i=0;i<15;i++) setTimeout(spawnHeart, i*300);
    setInterval(spawnHeart, 800);
  </script>
</body>
</html>
